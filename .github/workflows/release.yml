name: Release
run-name: Release ${{ github.ref_name }}

# Releases are cut with `script/tag-release vX.Y.Z`, which pushes the tag that triggers this
# workflow.
#
# This is stage one of two. It builds everything, signs and notarizes macOS, and leaves a DRAFT
# release containing the Linux and macOS archives. Windows signing keys are not available to CI,
# so the unsigned Windows executables are attached to this run as an artifact instead. An operator
# signs them out of band, then runs `script/finish-windows-release`, which timestamps them,
# assembles the Windows archives, regenerates the checksum manifest over all nine artifacts, and
# publishes the release.
#
# Nothing is public until that second stage completes.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    # codesign and notarytool are macOS-only, and cross-compilation is CGO-free, so one macOS
    # runner produces all nine binaries.
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          install-only: true

      - name: Import Apple Developer ID certificate
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password="$(uuidgen)"

          # create-keychain adds the new keychain to the user search list, which is what lets
          # codesign find the identity below.
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"

          # The Developer ID G2 intermediate is not bundled in the .p12, and codesign needs it to
          # build a chain from the leaf up to the Apple root.
          curl -sSfO https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import DeveloperIDG2CA.cer -k "$keychain"
          rm DeveloperIDG2CA.cer

          printf '%s' "$APPLE_CERT_P12" | openssl base64 -d -A -out "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S "apple-tool:,apple:,codesign:" -s -k "$keychain_password" "$keychain"

          echo "Available signing identities:"
          security find-identity -v -p codesigning

      - name: Build and archive
        env:
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          # Consumed by script/sign, which GoReleaser invokes as a post-build hook on each macOS
          # binary. Windows has no hook: it is signed out of band.
          APPLE_DEVELOPER_ID: ${{ vars.APPLE_DEVELOPER_ID }}
          REQUIRE_SIGNING: "1"
        run: goreleaser release --clean --skip=publish

      - name: Notarize macOS archives
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_DEVELOPER_ID: ${{ vars.APPLE_DEVELOPER_ID }}
          REQUIRE_SIGNING: "1"
        run: |
          shopt -s failglob
          script/sign dist/vulncheck_*_macOS_*.zip

      - name: Verify Linux and macOS artifacts
        run: script/verify-release --no-windows "${{ github.ref_name }}"

      - name: Collect unsigned Windows executables
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          shopt -s failglob
          mkdir -p unsigned

          # Named by architecture so the signing step, which writes signed-<name>.exe, produces
          # distinguishable outputs for all three.
          for arch in 386 amd64 arm64; do
            src="$(ls -d dist/windows_windows_${arch}*/bin/vulncheck.exe | head -1)"
            cp "$src" "unsigned/vulncheck_${arch}.exe"
          done

          ( cd unsigned && shasum -a 256 ./*.exe | tee SHA256SUMS.txt )

          # This is the build record the SOP's hash check compares against, so surface it where an
          # operator can read it without downloading anything.
          {
            echo "## Unsigned Windows executables — $TAG_NAME"
            echo
            echo "Signing attests to whatever bytes are in the file. Confirm these hashes"
            echo "match before signing anything."
            echo
            echo '```'
            cat unsigned/SHA256SUMS.txt
            echo '```'
            echo
            echo "Next: sign out of band per the release runbook, then run"
            echo '`script/finish-windows-release '"$TAG_NAME"' --signed-dir <dir>`'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: unsigned-windows
          path: unsigned/
          if-no-files-found: error
          retention-days: 30

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/vulncheck_*_linux_*.tar.gz
            dist/vulncheck_*_macOS_*.zip
            unsigned/*.exe

      - name: Create the draft release
        env:
          TAG_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s failglob
          VERSION="${TAG_NAME#v}"

          # Draft, and without the checksum manifest: both wait for the Windows archives, since
          # the manifest has to cover all nine artifacts. finish-windows-release publishes.
          release_args=(
            "$TAG_NAME"
            --draft
            --title "VulnCheck CLI ${VERSION}"
            --generate-notes
          )
          if [[ $TAG_NAME == *-* ]]; then
            release_args+=( --prerelease )
          fi

          gh release create "${release_args[@]}" \
            "dist/vulncheck_${VERSION}"_linux_*.tar.gz \
            "dist/vulncheck_${VERSION}"_macOS_*.zip
