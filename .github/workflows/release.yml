name: Release
run-name: Release ${{ github.ref_name }}

# Releases are cut with `script/tag-release vX.Y.Z`, which pushes the tag that triggers this
# workflow. Everything after that point happens here.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    # A single macOS runner builds all nine artifacts. codesign and notarytool are macOS-only, and
    # osslsigncode runs here too, so there is no need to fan out across three platforms.
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          install-only: true

      - name: Import Apple Developer ID certificate
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password="$(uuidgen)"

          # create-keychain adds the new keychain to the user search list, which is what lets
          # codesign find the identity below.
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"

          # The Developer ID G2 intermediate is not bundled in the .p12, and codesign needs it to
          # build a chain from the leaf up to the Apple root.
          curl -sSfO https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import DeveloperIDG2CA.cer -k "$keychain"
          rm DeveloperIDG2CA.cer

          printf '%s' "$APPLE_CERT_P12" | openssl base64 -d -A -out "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S "apple-tool:,apple:,codesign:" -s -k "$keychain_password" "$keychain"

          echo "Available signing identities:"
          security find-identity -v -p codesigning

      - name: Set up Windows signing
        env:
          WINDOWS_CERT_PEM: ${{ secrets.WINDOWS_CERT_PEM }}
          WINDOWS_KEY_PEM: ${{ secrets.WINDOWS_KEY_PEM }}
        run: |
          brew install osslsigncode

          printf '%s' "$WINDOWS_CERT_PEM" > "$RUNNER_TEMP/windows-cert.pem"
          printf '%s' "$WINDOWS_KEY_PEM" > "$RUNNER_TEMP/windows-key.pem"
          chmod 600 "$RUNNER_TEMP/windows-cert.pem" "$RUNNER_TEMP/windows-key.pem"

          # Fail before building rather than after. An expired certificate still yields a
          # signature, but Windows treats the result as unsigned.
          openssl x509 -in "$RUNNER_TEMP/windows-cert.pem" -noout -subject -dates
          if ! openssl x509 -in "$RUNNER_TEMP/windows-cert.pem" -noout -checkend 0; then
            echo "::error::Windows signing certificate has expired"
            exit 1
          fi
          # Warn while there is still time to renew.
          if ! openssl x509 -in "$RUNNER_TEMP/windows-cert.pem" -noout -checkend 2592000; then
            echo "::warning::Windows signing certificate expires within 30 days"
          fi

      - name: Build, sign, and archive
        env:
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          # Signing credentials are consumed by script/sign, which GoReleaser invokes as a post
          # hook on each macOS and Windows binary.
          APPLE_DEVELOPER_ID: ${{ vars.APPLE_DEVELOPER_ID }}
          CERT_FILE: ${{ runner.temp }}/windows-cert.pem
          KEY_FILE: ${{ runner.temp }}/windows-key.pem
          REQUIRE_SIGNING: "1"
        run: goreleaser release --clean --skip=publish

      - name: Notarize macOS archives
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_DEVELOPER_ID: ${{ vars.APPLE_DEVELOPER_ID }}
          REQUIRE_SIGNING: "1"
        run: |
          shopt -s failglob
          script/sign dist/vulncheck_*_macOS_*.zip

      - name: Verify artifacts
        run: script/verify-release "${{ github.ref_name }}"

      - name: Create the release
        env:
          TAG_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s failglob
          VERSION="${TAG_NAME#v}"

          release_args=(
            "$TAG_NAME"
            --title "VulnCheck CLI ${VERSION}"
            --generate-notes
          )
          if [[ $TAG_NAME == *-* ]]; then
            release_args+=( --prerelease )
          fi

          gh release create "${release_args[@]}" \
            "dist/vulncheck_${VERSION}"_*.tar.gz \
            "dist/vulncheck_${VERSION}"_*.zip \
            "dist/vulncheck_${VERSION}_checksums.txt"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/vulncheck_*_checksums.txt
