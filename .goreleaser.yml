version: 2

project_name: vulncheck

# Publishing is handled by script/release, which runs `goreleaser release --skip=publish` and
# only creates the GitHub release once signing, notarization and verification have all passed.
# Disabling it here means a stray `goreleaser release` cannot publish anything by accident.
release:
  disable: true

before:
  hooks:
    - >-
      {{ if eq .Runtime.Goos "windows" }}echo{{ end }} make manpages VC_VERSION={{.Version}}
    # Completions are portable cobra output; the linux and macos tarballs
    # both ship them, so generate on every non-Windows release runner.
    - >-
      {{ if eq .Runtime.Goos "windows" }}echo{{ end }} make completions

builds:
  - id: macos
    goos: [darwin]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    hooks:
      post:
        - cmd: ./script/sign '{{ .Path }}'
          output: true
    binary: bin/vulncheck
    main: ./cmd/vulncheck
    ldflags:
      - -s -w -X github.com/vulncheck-oss/cli/internal/build.Version={{.Version}} -X github.com/vulncheck-oss/cli/internal/build.Date={{time "2006-01-02"}}

  - id: linux
    goos: [linux]
    goarch: [386, arm, amd64, arm64]
    env:
      - CGO_ENABLED=0
    binary: bin/vulncheck
    main: ./cmd/vulncheck
    ldflags:
      - -s -w -X github.com/vulncheck-oss/cli/internal/build.Version={{.Version}} -X github.com/vulncheck-oss/cli/internal/build.Date={{time "2006-01-02"}}

  # No signing hook: Windows binaries are signed out of band. See script/release.
  - id: windows
    goos: [windows]
    goarch: [386, amd64, arm64]
    env:
      - CGO_ENABLED=0
    binary: bin/vulncheck
    main: ./cmd/vulncheck
    ldflags:
      - -s -w -X github.com/vulncheck-oss/cli/internal/build.Version={{.Version}} -X github.com/vulncheck-oss/cli/internal/build.Date={{time "2006-01-02"}}

archives:
  - id: linux-archive
    ids: [linux]
    name_template: "vulncheck_{{ .Version }}_linux_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    wrap_in_directory: true
    formats: [tar.gz]
    files:
      - LICENSE
      - ./share/man/man1/vulncheck*.1
      - ./share/bash-completion/completions/vulncheck
      - ./share/fish/vendor_completions.d/vulncheck.fish
      - ./share/zsh/site-functions/_vulncheck
  - id: macos-archive
    ids: [macos]
    name_template: "vulncheck_{{ .Version }}_macOS_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    wrap_in_directory: true
    formats: [zip]
    files:
      - LICENSE
      - ./share/man/man1/vulncheck*.1
      - ./share/bash-completion/completions/vulncheck
      - ./share/fish/vendor_completions.d/vulncheck.fish
      - ./share/zsh/site-functions/_vulncheck
  - id: windows-archive
    ids: [windows]
    name_template: "vulncheck_{{ .Version }}_windows_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    wrap_in_directory: false
    formats: [zip]
    files:
      - LICENSE

# script/release and script/verify-release both depend on this exact filename.
checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
